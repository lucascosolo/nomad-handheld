# Nomad default configuration.
#
# Layered: this file -> nomad.local.toml (gitignored, per-device) -> NOMAD_* env.
# Copy any section you want to change into nomad.local.toml; do not edit this
# file for device-specific values.

[core]
name = "nomad"
data_dir = "var"
log_level = "INFO"
log_format = "console"   # "console" | "json"

[api]
host = "127.0.0.1"       # localhost only until the API has auth (see ROADMAP)
port = 8080

[storage]
path = "var/nomad.db"

[agent]
# Which agent backend runs the loop. (D24)
#   mock       - no subprocess, no network. The default, so the whole system
#                runs and tests on a laptop. (D9)
#   claude_cli - Claude Code headless via the Agent SDK. (D19, D20)
#   remote_llm - a model on the tailnet. Not implemented yet.
backend = "mock"
# Permission mode: manual | session | smart | auto  (D14)
mode = "manual"
# Turn budget before the loop parks and asks to continue.
max_tool_calls_per_turn = 25
# Context compaction triggers at this fraction of the model's window. (D16)
# Applies only to backends that do NOT declare OWN_COMPACTION; claude_cli does,
# so this is ignored while it is selected.
compact_at = 0.75

[agent.claude_cli]
cli_path = "claude"
# Flags are a compatibility surface (D20). Checked at boot; mismatch logs loudly
# rather than failing, since a newer CLI usually still works.
expected_cli_version = "2.1.224"
# Subscription auth. This env var holds the `claude setup-token` result; the
# token itself never appears in a config file. ANTHROPIC_API_KEY is actively
# stripped from the child environment - if it is set, the CLI bills per token
# instead of against the subscription. (D20)
oauth_token_env = "CLAUDE_CODE_OAUTH_TOKEN"
model = "claude-sonnet-5"
# Capability switches, permissive by design. The target is that Nomad is as
# good at answering questions and writing code as Claude Code on a laptop, and
# skills, CLAUDE.md, plugins and MCP servers are a real part of why the laptop
# version is good. The broker (D21) is what makes that safe - crippling the
# toolset never was.
setting_sources = ["user", "project", "local"]
skills = "all"
# False lets the operator's own MCP servers load. Their tools still need a
# declaration in agent/claude_tools.py before the bridge will allow one, so
# relaxing this does not relax fail-closed.
strict_mcp_config = false

[agent.remote_llm]
# Planned (D24). A model on a workstation, reached over Tailscale - Nomad holds
# a tailnet address, never a public one.
base_url = ""
model = ""

# The memory Nomad owns.
# Memory is a searchable index that is retrieved from, not a payload that is
# carried. Only pinned memories are injected at session start; everything else
# is reached with recall. An injected block that grew with the store would be a
# context tax paid on every single turn, and an overloaded window makes the
# model write worse code.
[memory]
enabled = true
# Total rows before the least valuable unpinned memory is evicted. A pinned
# memory is never evicted; if everything is pinned, remembering is refused.
max_memories = 500
# The pinned set is the entire per-turn cost of memory, so it is small and
# deliberate. Pinning past this is refused and names the pin to drop.
max_pinned = 12
# Hard ceiling on the injected block, by characters and by count. Whichever
# binds first wins. Both are independent of how large the store has grown.
injection_budget_chars = 600
injection_max_memories = 8
# Rows one recall may return — recall output lands in context too.
recall_limit = 5
# Session rollover. A backend session resumed continuously for six months is
# untested and gets slower every week; the new session is seeded by the
# briefing, never by the old transcript. Zero disables that half of the policy.
session_max_age_hours = 168
session_max_turns = 500

# The durable notification queue. A notification is a persisted row, not an
# event: the bus drops slow subscribers on purpose (D6) and this screen is dark
# most of the time, so anything the device must still say later has to survive
# a reboot and wait for something to be watching.
[notifications]
enabled = true
# Resolved rows kept for audit before the oldest are pruned. Pending rows are
# never pruned - a pending notification is a promise the device made.
max_history = 200
# How many due notifications one poll hands over. A device that was off for a
# week wakes to a screenful, not a stampede.
max_deliveries_per_poll = 10
list_limit = 20
# Default window before a timer or reminder is swept as stale, in minutes.
# Showing a tea timer forty minutes late is worse than silence. Zero disables.
default_expiry_minutes = 240

# Offline daily utilities: timers, alarms, stopwatch, notes, world clock, unit
# conversion. No network, no model - this is the seed corpus for the offline
# tier, so every one of them answers with the radio off.
[utilities]
enabled = true
# Longest timer that is plausibly a timer rather than a slipped decimal point.
max_timer_hours = 48
max_notes = 500
note_search_limit = 10
note_preview_chars = 200
max_stopwatches = 8

# The offline tier. A deterministic phrase router answers common asks with no
# network, through the ordinary broker - "onboard" says where a call runs, never
# whether it was allowed.
#
# There is no matching setting here on purpose. The router matches exactly or
# hands the utterance to the model; a dial that catches more phrases would also
# catch wrong ones, and a mis-read intent is invisible to the operator in a way
# a round trip is not. New phrases are added to offline/catalog.py in a diff.
[offline]
enabled = true
# Evidence before Nomad asks to promote a phrase: frequent AND stable. Eight
# asks in one frustrated afternoon is an incident; five asks over three days is
# a habit, and the habit is what the operator is being asked to rule on.
promote_after_asks = 5
promote_after_days = 3
max_tracked_asks = 500
max_ask_chars = 200
# Proposals waiting at once. A backlog nobody reads teaches the operator to
# dismiss whatever the device suggests.
max_open_proposals = 5
# Promotion analysis is opportunistic work (D38): it yields the machine to any
# live turn, so this is a floor on how often it looks, not a promise.
analysis_interval_seconds = 900.0

# Self-authored apps. (D25)
[apps]
root = "var/apps"
# A newly authored app must import cleanly and survive this long under a
# smoke-launch before it is registered. Fail and it is quarantined, not listed.
smoke_test_seconds = 5
# Apps run in their own process (D29) — a model-authored file inside Nomad's
# process would reach the machine without passing the broker. A crash returns
# to the home screen.
restart_on_crash = false

# Self-configuration. (D26)
[settings]
# Validated mutations are written here, never to the committed defaults.
overrides_path = "nomad.local.toml"
# How many changes `revert(n)` can reach back through.
audit_history = 100

[workspace]
# Filesystem tools are confined to this root. (D15)
root = "var/workspace"
follow_symlinks_outside_root = false

[tools]
# Hosts an outbound request may reach without asking, in any mode (D31).
# Empty ships fail-closed; subdomains of an entry are covered.
allowed_network_hosts = []
# Arbitrary command execution. Disabled by default; never auto-runs even when
# enabled. (D5)
enable_run_command = false
command_timeout_seconds = 120
# Commands that may run without a prompt, in any mode (D41). Token prefixes,
# not substrings: "git status" covers `git status --short` and nothing else
# that begins with `git`. Any shell metacharacter disqualifies the command, so
# `pytest; rm -rf ~` matches nothing here.
#
# This list is exactly the verification set D22 makes load-bearing: the suite
# is the gate on self-modification, so Nomad has to be able to run it without
# a human answering a prompt per command. Everything on it is read-only or
# reports a result; nothing on it writes, publishes, or reaches another host —
# and an entry that somehow did would still be blocked, because SSH, HID,
# DESTRUCTIVE and network rules all run before this list is consulted.
allowed_commands = [
  "pytest",
  "ruff check",
  "ruff format --check",
  "git status",
  "git diff",
  "git log",
  "git show",
  "git branch",
  "git worktree list",
]

# NOTE: the old [ai] section is gone. Model selection is now backend selection
# ([agent].backend, D24) and lives with the backend it belongs to. D17's routing
# question - which model answers which request - is deferred until a second
# backend actually exists to route between.

[display]
driver = "mock"          # mock | headless | esp32
width = 320
height = 240
# Extra surfaces that mirror the primary one. `headless` here is what a monitor
# plugged into the Pi sees, because the browser view renders the headless
# surface's HTML - so HDMI needs no new rendering code. Every surface gets every
# write concurrently; one failing surface is logged and skipped rather than
# blacking out the others. A kind may not appear twice, and with `mirror` empty
# the primary driver is used directly with no fanout at all. (D36)
mirror = []              # e.g. ["headless"] alongside driver = "esp32"

[audio]
recorder_driver = "mock"       # mock | alsa
speaker_driver = "mock"        # mock | alsa
transcriber_driver = "mock"    # mock | whisper
synthesizer_driver = "mock"    # mock | piper
# Hard ceiling on one push_to_talk capture. A stuck key still cannot record
# forever - enforced by the driver, not by the operator releasing it. (D37)
max_record_seconds = 30.0

[skills]
# Progressive disclosure (D39). A name and one line stay in context; the body
# loads on request. The budget is what stops a growing library taxing every
# turn - truncation is announced, never silent.
enabled = true
# Where authored skills go: writable, gitignored, no release needed (D25).
root = "var/skills"
# The committed seed library, loaded first so a fresh checkout is not a device
# with no skills. Commented out means "the skills/ directory beside NOMAD.md".
# An authored skill of the same name shadows a seed - operators edit around the
# shipped set rather than editing the source tree. Set to "" to ship no seeds.
# seed_root = "skills"
# Raised from 800 when the seventh seed (`improving-yourself`) landed and the
# shipped index stopped fitting. Deliberate and in a diff, which is the only
# way this number should ever move: it is a tax paid on every single turn, so
# it buys headroom for about one more seed and no more. If an eighth is worth
# shipping, something here is worth deleting.
index_budget_chars = 1000

[resources]
# Background work yields the machine while a turn is live; the interface never
# yields to anything. (D38)
enabled = true
# How long an opportunistic workload has to park after being asked, before it
# is cancelled. Cooperative first, fatal second - "it will cooperate" is not an
# available assumption when the workload is model-authored (D25, D29).
suspend_deadline_seconds = 5.0
terminate_grace_seconds = 1.0
# Hysteresis. Turns arrive in bursts; do not resume heavy work in the gap
# between two of them.
resume_delay_seconds = 3.0

[usb_hid]
driver = "mock"          # mock | rp2040

[battery]
driver = "mock"          # mock | pisugar
# Below this percentage the agent defers background work. (D18)
low_threshold = 20
critical_threshold = 8

[camera]
driver = "mock"          # mock | picamera

[sensors]
driver = "mock"

[transports.esp32]
# These are live now - `protocol.create_transport` reads them. An unrecognised
# kind is rejected at config load rather than falling back to a mock, because a
# device that boots "connected" and stays silent is the worst thing to debug.
# `serial` requires a non-empty port, also enforced at load.
kind = "mock"            # mock | loopback | serial
port = "/dev/ttyACM0"
baudrate = 921600

[transports.rp2040]
kind = "mock"            # mock | loopback | serial
port = "/dev/ttyACM1"
baudrate = 115200

[input]
# Logical actions beyond the core set. (D13, D26)
# The core actions - NAV_UP/DOWN/LEFT/RIGHT, CONFIRM, BACK, ACTION_1, ACTION_2 -
# are always present and cannot be removed. Anything listed here is registered
# in addition, which is what makes "remap B to a dedicated AI button" a typed
# settings change rather than a special case.
extra_actions = ["ASSISTANT"]

# Physical -> logical input mapping. (D13)
# No application code may reference the left-hand side of these entries.
[input.buttons]
a = "CONFIRM"
b = "BACK"
x = "ACTION_1"
y = "ACTION_2"

[input.joystick]
deadzone = 0.25
# Fraction of the deadzone a stick must fall back below to count as centred
# again. Stops a stick resting on the threshold scrolling a menu on its own.
hysteresis = 0.7

# Hold-to-repeat, for buttons and the stick alike — a held button repeats too,
# which is why this is not under [input.joystick].
[input.repeat]
delay_ms = 400
interval_ms = 120
