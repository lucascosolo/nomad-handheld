[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad"
version = "0.1.0"
description = "Nomad - a modular pocket computer and persistent AI agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
# The Claude Code backend (D19, D24). Optional: the `mock` backend is the
# default, so the suite runs with no CLI and no credentials. Imported by exactly
# one module, `nomad/agent/backends/claude_cli.py`.
agent = ["claude-agent-sdk>=0.2.132"]
# Installed only on real hardware. Never a hard dependency: the whole system
# runs and tests on a laptop with mock drivers.
serial = ["pyserial-asyncio>=0.6"]
camera = ["picamera2>=0.3"]

[project.scripts]
nomad = "nomad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
